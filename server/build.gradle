plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.5'
}

group = 'com.catchnyang'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	protobufVersion = '4.31.1'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.flywaydb:flyway-mysql'
	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
	implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 프론트와 같이 쓰는 계약 파일은 저장소 루트의 protocol/ 에 있다 (game.proto, game-config.json)
def protocolDir = rootProject.file('protocol')

sourceSets {
	main {
		proto {
			srcDir protocolDir
		}
	}
}

// game-config.json 을 classpath 루트로 (서버 기본 설정·테스트가 classpath:game-config.json 으로 읽음)
tasks.named('processResources') {
	from(protocolDir) {
		include 'game-config.json'
	}
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'load'
	}
}

// 부하 측정 (느림, 기본 빌드에서 제외): ./gradlew loadTest -Dload.rooms=500 -Dload.seconds=20
tasks.register('loadTest', Test) {
	description = '방 N개를 실제 웹소켓으로 붙여 tick·지연·트래픽을 측정'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'load'
	}
	maxHeapSize = '2g'
	// 가상 스레드 pinning 등 진단: -Dload.jfr=파일경로 (JDK 21 의 jdk.tracePinnedThreads 는 JVM 을 멈추게 하는 버그가 있어 JFR 사용)
	if (System.getProperty('load.jfr')) jvmArgs "-XX:StartFlightRecording=filename=${System.getProperty('load.jfr')},settings=profile"
	systemProperties System.properties.findAll { it.key.toString().startsWith('load.') }
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
}
