services:
  mysql:
    image: mysql:8.4
    container_name: catchnyang-mysql
    environment:
      MYSQL_DATABASE: catchnyang
      MYSQL_USER: catchnyang
      MYSQL_PASSWORD: catchnyang
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
