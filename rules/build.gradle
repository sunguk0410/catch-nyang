// 게임 규칙 (순수 Java, 외부 의존성 없음). 서버(멀티)가 그대로 쓰고, 브라우저(싱글)는 rules-js 가 JS 로 바꿔 쓴다.
// 브라우저 변환(TeaVM)이 지원하지 않는 것은 쓰지 말 것: SplittableRandom, List.addFirst 등 최신 컬렉션 메서드,
// Math.hypot (JVM·JS 결과가 미세하게 다름 → sqrt 사용), HashMap/HashSet 순회 순서에 기대는 로직.
plugins {
	id 'java-library'
}

repositories {
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

dependencies {
	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
